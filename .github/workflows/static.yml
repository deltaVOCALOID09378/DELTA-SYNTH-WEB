# Made And Checked By DELTA SYNTH & All Agentic AI
# Original by GitHub Actions (Static Pages Workflow)
# Version: 0.1

# กระบวนการทำงานแบบเรียบง่ายสำหรับเผยแพร่เนื้อหาแบบคงที่ไปยัง GitHub Pages
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # ทำงานเมื่อมีการพุชโค้ดไปยังสาขาหลัก (main)
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # อนุญาตให้เรียกใช้กระบวนการนี้ด้วยตนเองจากหน้าต่าง Actions
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# กำหนดสิทธิ์การเข้าถึงของ GITHUB_TOKEN เพื่ออนุญาตการเผยแพร่ไปยัง GitHub Pages
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้มีการเผยแพร่เพียงรายการเดียวในเวลาเดียวกัน เพื่อป้องกันความซ้ำซ้อน
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# ไม่ยกเลิกงานที่กำลังดำเนินการอยู่ เพื่อให้การเผยแพร่เสร็จสมบูรณ์
# Do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # งานสำหรับการเผยแพร่ (Deploy Job)
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ดึงข้อมูลโค้ด (Checkout Repository)
        uses: actions/checkout@v4

      - name: ตั้งค่า GitHub Pages (Setup Pages)
        uses: actions/configure-pages@v5

      - name: อัปโหลดชิ้นงาน (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # อัปโหลดข้อมูลทั้งหมดในโฟลเดอร์ปัจจุบัน
          # Upload entire repository
          path: '.'

      - name: เผยแพร่ไปยัง GitHub Pages (Deploy to GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v5
